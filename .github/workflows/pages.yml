name: Publish replay benchmark
on:
  workflow_dispatch:
    inputs:
      asset:
        description: Immutable JSON report archive in the reports release
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Download selected report
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_ASSET: ${{ inputs.asset }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          name = os.environ['REPORT_ASSET']
          assert re.fullmatch(r'report-[0-9a-f]{20}\.tar\.gz', name)
          release = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + os.environ['REPOSITORY'] + '/releases/tags/reports'], text=True))
          assets = [asset for asset in release['assets'] if asset.get('state') == 'uploaded'
                    and re.fullmatch(r'report-[0-9a-f]{20}\.tar\.gz', asset['name'])]
          assert any(asset['name'] == name for asset in assets), 'Selected report is not a completed upload'
          latest = max(assets, key=lambda asset: (asset['created_at'], asset['id']))
          current = name == latest['name']
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('current=' + str(current).lower() + '\n')
          if current:
              subprocess.run(['gh', 'release', 'download', 'reports', '--repo', os.environ['REPOSITORY'], '--pattern', name, '--dir', '/tmp/report'], check=True)
          else:
              print('Skipping an older report: a newer completed publication already exists.')
          PY
      - name: Prepare static website
        if: steps.report.outputs.current == 'true'
        env:
          REPORT_ASSET: ${{ inputs.asset }}
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, re, shutil, tarfile
          from collections import Counter, defaultdict
          MiB = 1024**2
          MAX_REPORT_BYTES = 25 * MiB
          # Thirty retained reports plus their manifest can exceed the old 250 MiB cap.
          MAX_ARCHIVE_BYTES = 800 * MiB
          # Leave room below GitHub Pages' 1 GB site limit, including all derived aliases.
          MAX_SITE_BYTES = 900 * MiB
          shutil.copytree('site', 'dist')
          with tarfile.open(pathlib.Path('/tmp/report') / os.environ['REPORT_ASSET']) as archive:
              total = 0
              for member in archive:
                  path = pathlib.PurePosixPath(member.name)
                  assert member.isfile() and not path.is_absolute() and '..' not in path.parts
                  assert str(path) == 'manifest.json' or (len(path.parts) == 2 and path.parts[0] in ('data', 'coverage', 'changes') and path.suffix == '.json')
                  total += member.size
                  if member.size >= MAX_REPORT_BYTES:
                      raise ValueError(f'Report {path} exceeds the 25 MiB file budget ({member.size} bytes)')
                  if total >= MAX_ARCHIVE_BYTES:
                      raise ValueError(f'Retained report JSON exceeds the 800 MiB archive budget ({total} bytes)')
                  data = archive.extractfile(member).read()
                  json.loads(data)
                  target = pathlib.Path('dist') / str(path)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          manifest = json.loads(pathlib.Path('dist/manifest.json').read_text())
          # Validate byte-pinned references before generating aliases or deploying.
          for run in manifest['runs']:
              files = run.get('files')
              if files is None:
                  continue  # Previously published legacy archives remain readable.
              assert 'details' in files and set(files) <= {'details', 'coverage', 'changes'}
              for kind, descriptor in files.items():
                  folder = {'details': 'data', 'coverage': 'coverage', 'changes': 'changes'}[kind]
                  assert descriptor['url'] == folder + '/' + run['id'] + '.json'
                  raw = (pathlib.Path('dist') / descriptor['url']).read_bytes()
                  assert descriptor['bytes'] == len(raw)
                  assert descriptor['sha256'] == hashlib.sha256(raw).hexdigest(), 'Report version hash differs'
                  value = json.loads(raw)
                  assert value['run']['id'] == run['id'] and value['run']['sha'] == run['sha']
                  if kind == 'details':
                      assert value['run']['status'] == run['status']
                      for scope in ('fixed', 'growing', *[s for s in ('core500', 'extension500', 'combined1000') if s in run]):
                          assert value['run'][scope]['total'] == run[scope]['total']
                          assert value['run'][scope]['finished'] == run[scope]['finished']
                      assert len(value['rows']) == run['growing']['finished']
                      assert sum(bool(row['fixed']) for row in value['rows']) == run['fixed']['finished']
                      for scope in ('core500', 'extension500', 'combined1000'):
                          if scope in run:
                              assert sum(scope in row.get('cohorts', []) for row in value['rows']) == run[scope]['finished']
                              assert value['run'][scope]['membership_sha256'] == run[scope]['membership_sha256']
          checkpoint_definitions = json.loads(pathlib.Path('site/checkpoint-checks.json').read_text())
          checkpoint_checks = {check['word']: check for check in checkpoint_definitions['checks']}
          runs = sorted(
              (run for run in manifest['runs'] if not run.get('pilot') and run['status'] != 'continued'),
              key=lambda run: datetime.datetime.fromisoformat(run['created']), reverse=True,
          )
          import runpy
          engine_diagnostics = runpy.run_path('site/engine_diagnostics.py')
          def stopping_reasons(rows, total):
              outcomes = Counter(row['status'] for row in rows)
              groups = defaultdict(set)
              checkpoint_words = {}
              labels = {
                  'unsupported': 'Unsupported update',
                  'initialization_unsupported': 'Unsupported initialization',
                  'checkpoint_mismatch': 'Recorded checkpoint mismatch',
                  'parse_error': 'Recording parse error',
                  'multiple_chapters': 'Multiple recording chapters',
                  'timeout': 'Replay time limit exceeded',
                  'process_failure': 'Replay process failed',
                  'worker_error': 'Worker error',
                  'input_changed': 'Recording changed',
                  'invalid_result': 'Invalid engine result',
                  'version_mismatch': 'Wrong game version',
                  'empty': 'Empty recording',
              }
              for row in rows:
                  status = row['status']
                  if status == 'complete':
                      continue
                  reasons = set()
                  for item in engine_diagnostics['conditions'](row):
                      if item.get('reason'):
                          reasons.add((item.get('engine_error', {}).get('kind'), str(item['reason'])))
                  if status == 'checkpoint_mismatch':
                      for difference in row.get('differences', []):
                          word = difference.get('word')
                          check = checkpoint_checks.get(word) if row.get('build') == checkpoint_definitions['build'] else None
                          label = check['label'] if check else f'Checkpoint word {word}'
                          reason = 'Checkpoint mismatch: ' + label
                          reasons.add((None, reason))
                          checkpoint_words[(status, reason)] = word
                  if not reasons:
                      reasons.add((None, str(row.get('reason') or row.get('error') or labels.get(status, status))))
                  for kind, reason in reasons:
                      groups[(status, kind, reason)].add(row['match_id'])
              stopped = len(rows) - outcomes['complete']
              return {
                  'total_recordings': total,
                  'measured_recordings': len(rows),
                  'pending_recordings': max(0, total - len(rows)),
                  'stopped_recordings': stopped,
                  'outcomes': dict(sorted(outcomes.items())),
                  'engine_errors': engine_diagnostics['summary'](rows),
                  'reasons': [
                      {'status': status, 'reason': reason, 'count': len(ids),
                       **({'engine_kind': kind} if kind else {}),
                       'percent_of_stopped': round(100 * len(ids) / stopped, 2),
                       'examples': sorted(ids)[:5],
                       **({'checkpoint_word': checkpoint_words[(status, reason)]}
                          if (status, reason) in checkpoint_words else {})}
                      for (status, kind, reason), ids in sorted(groups.items(), key=lambda item: (-len(item[1]), item[0][0], item[0][1] or '', item[0][2]))
                  ],
              }
          for name, candidates in (
              ('latest.json', runs),
              ('latest-completed.json', [run for run in runs if run['status'] == 'complete']),
              ('latest-running.json', [run for run in runs if run['status'] in ('queued', 'building', 'running')]),
          ):
              if not candidates:
                  continue
              run = candidates[0]
              assert re.fullmatch(r'[A-Za-z0-9_-]+', run['id'])
              source = pathlib.Path('dist/data') / (run['id'] + '.json')
              report = json.loads(source.read_bytes())
              assert report['run']['id'] == run['id'] and report['run']['sha'] == run['sha']
              assert report['run']['status'] == run['status']
              assert isinstance(report['rows'], list) and isinstance(report['identity'], dict)
              # Serve the complete original report, without redirects or a reduced schema.
              shutil.copyfile(source, pathlib.Path('dist') / name)
              changes_source = pathlib.Path('dist/changes') / (run['id'] + '.json')
              if changes_source.is_file():
                  changes = json.loads(changes_source.read_bytes())
                  assert changes['schema'] == 1
                  assert changes['run']['id'] == run['id'] and changes['run']['sha'] == run['sha']
                  if changes.get('available'):
                      assert changes['fixed']['total_recordings'] == run['fixed']['total']
                      assert changes['growing']['total_recordings'] == run['growing']['total']
                      for scope in ('core500', 'extension500', 'combined1000'):
                          if scope in run:
                              assert changes[scope]['total_recordings'] == run[scope]['total']
                  changes_alias = pathlib.Path('dist') / (name.removesuffix('.json') + '-changes.json')
                  shutil.copyfile(changes_source, changes_alias)
                  shutil.copyfile(changes_alias, changes_alias.with_suffix(''))
              coverage_source = pathlib.Path('dist/coverage') / (run['id'] + '.json')
              if coverage_source.is_file():
                  coverage = json.loads(coverage_source.read_bytes())
                  assert coverage['schema'] == 1
                  assert coverage['run'] == {'id': run['id'], 'sha': run['sha']}
                  assert coverage['fixed']['total_recordings'] == run['fixed']['total']
                  assert coverage['growing']['total_recordings'] == run['growing']['total']
                  for scope in ('core500', 'extension500', 'combined1000'):
                      if scope in run:
                          assert coverage[scope]['total_recordings'] == run[scope]['total']
                  coverage_alias = pathlib.Path('dist') / (name.removesuffix('.json') + '-command-coverage.json')
                  shutil.copyfile(coverage_source, coverage_alias)
                  shutil.copyfile(coverage_alias, coverage_alias.with_suffix(''))
              summary = {
                  'schema': 1, 'generated': manifest['generated'],
                  'run': report['run'], 'source_report': 'data/' + run['id'] + '.json',
                  'counting': 'Distinct recordings per reported condition at their first stopping point. '
                              'Checkpoint mismatches are grouped by differing check, not by inferred cause. '
                              'A recording can report multiple conditions, so reason counts can overlap.',
                  'checkpoint_definitions': 'checkpoint-checks.json',
                  'fixed': stopping_reasons([row for row in report['rows'] if row['fixed']], report['run']['fixed']['total']),
                  'growing': stopping_reasons(report['rows'], report['run']['growing']['total']),
                  **{scope: stopping_reasons([row for row in report['rows'] if scope in row.get('cohorts', [])], report['run'][scope]['total'])
                     for scope in ('core500', 'extension500', 'combined1000') if scope in report['run']},
              }
              summary_path = pathlib.Path('dist') / (name.removesuffix('.json') + '-stopping-simulation.json')
              summary_path.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n')
              # Preserve the requested extensionless URL as an identical downloadable JSON file.
              shutil.copyfile(summary_path, summary_path.with_suffix(''))
              simulated_rows = [
                  {**{key: row.get(key) for key in (
                      'match_id', 'sha256', 'fixed', 'build', 'status',
                      'completed_ticks', 'total_ticks', 'checkpoints_passed', 'total_checkpoints',
                      'last_matching_checkpoint_tick', 'ignored_commands_to_stop',
                  )}, **({'cohorts': row['cohorts']} if 'cohorts' in row else {})}
                  for row in report['rows'] if row['status'] == 'complete'
              ]
              simulated_rows.sort(key=lambda row: (-(row['checkpoints_passed'] or 0), row['match_id']))
              simulated = {
                  'schema': 1, 'generated': manifest['generated'],
                  'run': {key: report['run'].get(key) for key in (
                      'id', 'sha', 'status', 'created', 'finished', 'build_profile', 'architecture',
                  )},
                  'source_report': 'data/' + run['id'] + '.json',
                  'scope': 'growing', 'count': len(simulated_rows), 'rows': simulated_rows,
              }
              simulated_path = pathlib.Path('dist') / (name.removesuffix('.json') + '-simulated.json')
              simulated_path.write_text(json.dumps(simulated, ensure_ascii=False, indent=2) + '\n')
              shutil.copyfile(simulated_path, simulated_path.with_suffix(''))
          import runpy
          runpy.run_path('site/engine_reports.py')['build']('dist')
          site_bytes = sum(path.stat().st_size for path in pathlib.Path('dist').rglob('*') if path.is_file())
          if site_bytes >= MAX_SITE_BYTES:
              raise ValueError(f'Generated website exceeds the 900 MiB site budget ({site_bytes} bytes)')
          print(f'Report history: {total / MiB:.1f} MiB; complete website: {site_bytes / MiB:.1f} MiB')
          PY
      - uses: actions/configure-pages@v5
        if: steps.report.outputs.current == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.report.outputs.current == 'true'
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        if: steps.report.outputs.current == 'true'
        id: deployment
